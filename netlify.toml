[build]
  command = "npm run build"
  publish = "dist"

# Redirections domaine : www → non-www + HTTP → HTTPS
[[redirects]]
  from = "https://www.vitriersparis.fr/*"
  to = "https://vitriersparis.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.vitriersparis.fr/*"
  to = "https://vitriersparis.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://vitriersparis.fr/*"
  to = "https://vitriersparis.fr/:splat"
  status = 301
  force = true

# Redirections savvitrerie.fr → vitriersparis.fr
[[redirects]]
  from = "https://savvitrerie.fr/*"
  to = "https://vitriersparis.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.savvitrerie.fr/*"
  to = "https://vitriersparis.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://savvitrerie.fr/*"
  to = "https://vitriersparis.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.savvitrerie.fr/*"
  to = "https://vitriersparis.fr/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
